name: Docker Build and Push to ECR

on:
  workflow_call:
    inputs:
      dockerPath:
        type: string
        required: true
        default: Dockerfile

# Removido AWS_REGION do env global para usar direto da secret do ambiente, 
# mantendo a flexibilidade se cada ambiente estiver em uma região diferente.
env:
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Agora usamos nomes genéricos. O GitHub injetará o valor de HML ou PRD 
      # automaticamente conforme definido no workflow pai.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{version}}

      # Removi a criação do arquivo .env pois, como discutimos, 
      # o ideal é injetar via Environment Variables no ECS para manter a imagem limpa.
      # Se você AINDA precisar dele por algum motivo específico de build, descomente abaixo:
      # - name: Create .env file from secret
      #   run: echo "${{ secrets.ENVS }}" > .env

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: "${{ inputs.dockerPath }}"
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
